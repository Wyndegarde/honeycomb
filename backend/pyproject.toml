[project]
name = "honeycomb"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
extend-select = ["B", "E", "F", "I", "N", "Q","S", "W", "UP", "ASYNC", "ERA001", "T203", "SLF001", "SIM112", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["app/db/migrations/versions"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
